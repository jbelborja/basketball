name: Extracción FBM y Despliegue

on:
  schedule:
    # Ejecución semanal: Todos los lunes a las 19:00 UTC
    - cron: '0 19 * * 1'
  workflow_dispatch:
    # Permite ejecución manual bajo demanda

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Ejecutar Extracción de Datos FBM
        run: |
          python scripts/scrape_fbm.py

      - name: Guardar cambios de datos en repositorio (si los hay)
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/ content/
          if git diff --staged --quiet; then
            echo "No hay cambios en los datos. Continuando con el despliegue..."
          else
            git commit -m "auto: Actualización de datos FBM [skip ci]"
            git push
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Compilar estilos CSS
        run: |
          npm ci
          npm run build:css

      - name: Configurar Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true

      - name: Compilar sitio web con Hugo
        run: |
          hugo --minify

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir artefacto de GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public'

      - name: Desplegar a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
