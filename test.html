<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 p-4">

    <div class="match-item bg-slate-900 border border-slate-800 rounded-3xl p-4 sm:p-6 shadow-xl space-y-4">
      
      <!-- Top Metadata Header -->
      <div class="flex flex-wrap items-center justify-between gap-2 pb-3 border-b border-slate-800/80 text-xs">
        <div class="flex items-center gap-2 flex-wrap">
          <span class="px-2.5 py-1 rounded-full bg-slate-950 text-orange-400 font-bold border border-slate-800">
            Cadete masculino
          </span>
          <span class="px-2.5 py-1 rounded-full bg-slate-800/60 text-slate-400 border border-slate-700/60 truncate max-w-xs">
            🏆 Liga Cadete
          </span>
          <span class="text-slate-400 font-medium">
            📅 10/10/2026 · 🕒 12:00
          </span>
        </div>
        <div>
          <span class="px-2.5 py-1 rounded-full text-[10px] font-bold bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 uppercase tracking-wider">
            FINALIZADO
          </span>
        </div>
      </div>

      <!-- Teams & Score Row -->
      <div class="py-2 grid grid-cols-[1fr_auto_1fr] md:grid-cols-11 gap-2 sm:gap-4 items-center">
        
        <!-- Home Team -->
        <div class="md:col-span-4 flex flex-col md:flex-row items-center gap-2 md:gap-3 md:justify-end text-center md:text-right">
          <div class="order-2 md:order-1">
            <span class="font-sports text-sm sm:text-2xl font-bold text-white leading-tight line-clamp-2 md:line-clamp-none">COLMENAR VIEJO C</span>
            <span class="hidden md:block text-[10px] text-slate-500 uppercase font-semibold">Local</span>
          </div>
          <div class="w-10 h-10 sm:w-14 sm:h-14 rounded-full bg-slate-800 order-1 md:order-2"></div>
        </div>

        <!-- Score / VS -->
        <div class="md:col-span-3 text-center">
          <div class="inline-block px-2 py-1 sm:px-4 sm:py-2 bg-slate-950 rounded-xl sm:rounded-2xl border border-slate-800/80">
            <div class="font-sports text-xl sm:text-4xl font-bold text-white whitespace-nowrap">
              <span class="text-orange-400">77</span>
              <span class="text-slate-600">-</span>
              <span>70</span>
            </div>
          </div>
        </div>

        <!-- Away Team -->
        <div class="md:col-span-4 flex flex-col md:flex-row items-center gap-2 md:gap-3 text-center md:text-left">
          <div class="w-10 h-10 sm:w-14 sm:h-14 rounded-full bg-slate-800"></div>
          <div>
            <span class="font-sports text-sm sm:text-2xl font-bold text-white leading-tight line-clamp-2 md:line-clamp-none">RIVAS SURESTE</span>
            <span class="hidden md:block text-[10px] text-slate-500 uppercase font-semibold">Visitante</span>
          </div>
        </div>

      </div>

      <!-- Bottom Venue & Action Footer -->
      <div class="pt-3 border-t border-slate-800/80 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3 text-xs text-slate-400">
        <div class="flex items-center gap-1.5 min-w-0 flex-1 overflow-hidden">
          <span class="text-orange-400 font-bold flex-shrink-0">📍</span>
          <a href="#" class="text-slate-300 font-medium truncate underline">Pabellon Municipal</a>
        </div>
        <div class="flex items-center gap-2 flex-shrink-0 w-full sm:w-auto justify-between sm:justify-end">
          <a href="#" class="inline-flex items-center bg-slate-800/50 px-3 py-2 rounded-xl border border-slate-700 w-full sm:w-auto justify-center">📅 Calendario</a>
          <a href="#" class="inline-flex items-center bg-slate-800 px-4 py-2 rounded-xl text-white w-full sm:w-auto justify-center">Ficha Detalle →</a>
        </div>
      </div>

    </div>

</body>
</html>
